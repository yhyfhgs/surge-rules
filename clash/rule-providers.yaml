  - RULE-SET,US,🇺🇸美国
  - RULE-SET,UK,🇬🇧英国
  - RULE-SET,Europe,🇪🇺欧洲
  - RULE-SET,PrivateLAN,DIRECT
  - RULE-SET,PKU,DIRECT
  - RULE-SET,GameDownloadCN,DIRECT
  - RULE-SET,MicrosoftCN,DIRECT
  - RULE-SET,AppleCN,DIRECT
  - RULE-SET,Domestic,DIRECT
  - RULE-SET,ChinaMedia,DIRECT
  - RULE-SET,TencentCN,DIRECT
  - RULE-SET,AlibabaCN,DIRECT
