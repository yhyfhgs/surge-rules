  - RULE-SET,ChinaDomain,DIRECT
  - RULE-SET,ChinaTLD,DIRECT
  - RULE-SET,RejectIP,REJECT
  - RULE-SET,YouTubeIP,流媒体
  - RULE-SET,StreamingIP,流媒体
  - RULE-SET,GoogleIP,Google-X-Meta-MS
  - RULE-SET,TwitterIP,Google-X-Meta-MS
  - RULE-SET,MetaIP,Google-X-Meta-MS
  - RULE-SET,AIIP,AI
  - RULE-SET,TelegramIP,Telegram
  - RULE-SET,TikTokIP,社交媒体
  - RULE-SET,GamesIP,游戏
  - AND,((RULE-SET,JapanIP),(NOT,((RULE-SET,PrivateLANIP))),(NOT,((RULE-SET,PKUIP))),(NOT,((RULE-SET,AppleCNIP))),(NOT,((RULE-SET,ChinaIP)))),🇯🇵日本
  - AND,((RULE-SET,USIP),(NOT,((RULE-SET,PrivateLANIP))),(NOT,((RULE-SET,PKUIP))),(NOT,((RULE-SET,AppleCNIP))),(NOT,((RULE-SET,ChinaIP)))),🇺🇸美国
  - AND,((RULE-SET,UKIP),(NOT,((RULE-SET,PrivateLANIP))),(NOT,((RULE-SET,PKUIP))),(NOT,((RULE-SET,AppleCNIP))),(NOT,((RULE-SET,ChinaIP)))),🇬🇧英国
  - AND,((RULE-SET,EuropeIP),(NOT,((RULE-SET,PrivateLANIP))),(NOT,((RULE-SET,PKUIP))),(NOT,((RULE-SET,AppleCNIP))),(NOT,((RULE-SET,ChinaIP)))),🇪🇺欧洲
  - RULE-SET,PrivateLANIP,DIRECT
  - RULE-SET,PKUIP,DIRECT
  - RULE-SET,AppleCNIP,DIRECT
  - RULE-SET,ChinaIP,DIRECT
  - MATCH,Final
