# AUTO-GENERATED — edit lists/, config/routing.json or config/mihomo-runtime.yaml.
# Replace the corresponding top-level sections in your private Mihomo config.
# Supply the manifest policy groups and a Proxy group with a real remote exit.
# Source rules are lossless; SYSTEM has no portable equivalent; LAN uses GEOIP,lan.
# Global sniffing approximates Surge extended-matching; it is not identical.
# See docs/CLASH.md for DNS scope, bootstrap and deployment verification.
# Source template for the generated Mihomo merge configuration.
# Merge by REPLACING dns, tun, sniffer and rules, not appending subscription DNS.
# Proxy must select a real remote proxy, with no DIRECT fallback.
# Bootstrap resolves proxy hostnames only; use IP-literal nodes to avoid even that lookup.
mode: rule
ipv6: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter: [localhost, '+.local', '+.lan']
  use-hosts: false
  use-system-hosts: false
  prefer-h3: false
  respect-rules: false
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://120.53.53.53/dns-query#DIRECT
  proxy-server-nameserver-policy: {}
  nameserver:
    - https://1.1.1.1/dns-query#Proxy
    - https://8.8.8.8/dns-query#Proxy
  nameserver-policy: {}
  fallback: []
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://120.53.53.53/dns-query#DIRECT
  direct-nameserver-follow-policy: false
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff:
    HTTP: {ports: [80, 8080-8880]}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

